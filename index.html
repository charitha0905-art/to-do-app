<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📝 My To-Do App</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Add Task Form -->
                <div class="card shadow-lg mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Add a New Task</h5>
                        <form id="taskForm">
                            <div class="input-group">
                                <input 
                                    type="text" 
                                    id="taskInput" 
                                    class="form-control" 
                                    placeholder="Enter a new task here..."
                                    autocomplete="off"
                                >
                                <button class="btn btn-primary" type="submit">Add Task</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Task Counter -->
                <div class="alert alert-info" role="alert">
                    <strong>Tasks:</strong> <span id="taskCount">0</span> remaining
                </div>

                <!-- Task List -->
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h5 class="card-title">Your Tasks</h5>
                        <div id="taskList" class="task-list">
                            <p class="text-muted text-center">No tasks yet. Add one to get started!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <p class="text-muted mb-0">Built with HTML, CSS, Bootstrap 5 & JavaScript</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 
        CHOOSE ONE:
        
        Option 1: Frontend-only (in-memory, no backend needed)
        <script src="script.js"></script>
        
        Option 2: Full-stack with backend (requires Flask server running)
        <script src="script_backend.js"></script>
    -->
    <script src="script_backend.js"></script>
</body>
</html>
